name: Bagan Native V3.6.3 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native-v343/**'
      - '.github/workflows/build-bagan-native-v343.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Native Project
        run: test -f native-v343/settings.gradle.kts && test -f native-v343/app/src/main/java/asia/aaii/bagan/MainActivity.kt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble APK
        working-directory: native-v343
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Bagan-Native-V3.6.3-debug-APK
          path: native-v343/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
