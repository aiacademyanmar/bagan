name: Bagan Native V3.4.3 APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'native-v343/**'
      - '.github/workflows/build-bagan-native-v343.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Expand Native Android project
        working-directory: native-v343
        run: base64 --decode source.zip.b64 > src.zip && unzip -oq src.zip -d .
      - name: Build installable debug APK
        working-directory: native-v343
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Bagan-Native-V3.4.3-debug-APK
          path: native-v343/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
