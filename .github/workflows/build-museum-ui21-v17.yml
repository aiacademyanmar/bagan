name: Build Bagan Museum Native UI21 V1.7
on:
  push:
    branches:
      - bagan-museum-native-v1-7-ui21
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Generate offline GLB and viewers
        run: |
          python3 tools/generate_glb.py
          python3 tools/build_heritage_models_v16.py
      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK assets
        run: |
          python3 - <<'PY'
          import zipfile,json
          path="app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(path) as z:
              items=z.namelist()
              assert len([n for n in items if n.startswith("assets/models/") and n.endswith(".glb")])==10
              for name in ("assets/temple_viewer.html","assets/artifacts.html","assets/heritage_viewer_v16.html"):
                  assert name in items,name
          print("UI21 build contains 10 offline concept GLBs")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Bagan-Museum-UI21-V1.7-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
