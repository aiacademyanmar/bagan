name: Build Bagan Museum Native APK V1.2
on:
  push:
    branches:
      - bagan-museum-native-v1-2
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Generate Offline GLB and Viewer
        run: python3 tools/generate_glb.py
      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Bagan-Museum-Native-V1.2-APK-and-GLB
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/src/main/assets/bagan_museum_concept.glb
          if-no-files-found: error
