name: Build Bagan Museum Native APK V1.5
on:
  push:
    branches:
      - bagan-museum-native-v1-5
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Generate museum GLB assets
        run: python3 tools/generate_glb.py
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate APK content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,json
          apk=Path("app/build/outputs/apk/debug/app-debug.apk")
          assert apk.exists()
          with zipfile.ZipFile(apk) as z:
              for f in ["assets/bagan_museum_concept.glb","assets/artifacts.html","assets/bagan_drive_catalog_v15.json"]:
                  assert f in z.namelist(), f
              catalog=json.loads(z.read("assets/bagan_drive_catalog_v15.json"))
              assert len(catalog["items"]) == 10
              print("APK VALIDATED:",apk.stat().st_size,"10 catalog entries")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Bagan-Museum-Native-V1.5-APK-GLB-Catalog
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/src/main/assets/bagan_museum_concept.glb
            app/src/main/assets/bagan_drive_catalog_v15.json
          if-no-files-found: error
