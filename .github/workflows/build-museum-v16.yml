name: Build Bagan Museum Native APK V1.6
on:
  push:
    branches:
      - bagan-museum-native-v1-6
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build museum and 10 distinct offline heritage GLBs
        run: |
          python3 tools/generate_glb.py
          python3 tools/build_heritage_models_v16.py
      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate APK assets and GLB headers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,json,struct
          apk=Path("app/build/outputs/apk/debug/app-debug.apk")
          assert apk.is_file()
          with zipfile.ZipFile(apk) as z:
              for p in ["assets/bagan_museum_concept.glb","assets/heritage_viewer_v16.html","assets/heritage_model_manifest_v16.json"]:
                  assert p in z.namelist(), p
              manifest=json.loads(z.read("assets/heritage_model_manifest_v16.json"))
              assert len(manifest)==10
              for m in manifest:
                  name="assets/models/"+m["slug"]+".glb"
                  raw=z.read(name)
                  magic,version,length=struct.unpack_from("<III",raw,0)
                  assert magic==0x46546c67 and version==2 and length==len(raw),name
                  assert m["model_type"]=="illustrative_concept_not_blend_export"
                  print(name,len(raw),"valid")
          print("APK:",apk.stat().st_size,"bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Bagan-Museum-Native-V1.6-APK-10-GLB
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/src/main/assets/models/*.glb
            app/src/main/assets/heritage_model_manifest_v16.json
          if-no-files-found: error
