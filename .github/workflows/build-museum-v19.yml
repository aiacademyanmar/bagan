name: Build Bagan Museum V1.9 Native
on:
  push:
    branches: [bagan-museum-native-v1-9]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v4
      - name: Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build offline models
        run: |
          python3 tools/generate_glb.py
          python3 tools/build_heritage_models_v16.py
      - name: Compile Android APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify assets
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("app/build/outputs/apk/debug/app-debug.apk") as z:
            paths=z.namelist()
            assert len([x for x in paths if x.startswith("assets/models/") and x.endswith(".glb")])==10
            assert "assets/heritage_viewer_v16.html" in paths
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Bagan-Museum-Native-V1.9-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
