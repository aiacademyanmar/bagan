name: Build Bagan Museum V2.0 Native APK
on:
  push:
    branches: [bagan-museum-native-v2-0]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Generate offline museum & monuments
        run: |
          python3 tools/generate_glb.py
          python3 tools/build_heritage_models_v16.py
      - name: Compile V2.0 Debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, json, hashlib
          p=Path("app/build/outputs/apk/debug/app-debug.apk")
          assert p.is_file()
          with zipfile.ZipFile(p) as z:
              all=z.namelist()
              for item in ("assets/heritage_viewer_v16.html","assets/bagan_drive_catalog_v15.json"):
                  assert item in all,item
              glbs=[name for name in all if name.startswith("assets/models/") and name.endswith(".glb")]
              assert len(glbs)==10,len(glbs)
              assert len(json.loads(z.read("assets/bagan_drive_catalog_v15.json"))["items"])==10
          print("PASS: 10 GLB assets present; APK size",p.stat().st_size,"SHA256",hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Bagan-Museum-Native-V2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
