name: Build Bagan Museum Native V2.1 APK
on:
  push:
    branches: [bagan-museum-native-v2-1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build museum and offline heritage models
        run: |
          python3 tools/generate_glb.py
          python3 tools/build_heritage_models_v16.py
      - name: Compile Native APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate 3D hotspots and assets
        run: |
          python3 - <<'PY'
          import zipfile
          p="app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(p) as z:
            files=z.namelist()
            assert len([x for x in files if x.startswith("assets/models/") and x.endswith(".glb")])==10
            v=z.read("assets/heritage_viewer_v16.html")
            assert b"hotspot-marker" in v and b"updateHotspots" in v
            print("PASS: 10 GLBs and interactive hotspot viewer")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Bagan-Museum-Native-V2.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
