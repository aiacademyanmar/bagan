name: Build Bagan Museum V2.2 Native APK
on:
  push:
    branches: [bagan-museum-native-v2-2]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Generate 3D models
        run: |
          python3 tools/generate_glb.py
          python3 tools/build_heritage_models_v16.py
      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate GLBs
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("app/build/outputs/apk/debug/app-debug.apk") as z:
            assert len([p for p in z.namelist() if p.startswith("assets/models/") and p.endswith(".glb")]) == 10
            assert b"hotspot-marker" in z.read("assets/heritage_viewer_v16.html")
          print("Verified 10 GLB assets and 3D hotspot viewer")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Bagan-Museum-Native-V2.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
