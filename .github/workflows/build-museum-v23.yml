name: Build Bagan Museum V2.3 APK
on:
  push:
    branches: [bagan-museum-native-v2-3]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: |
          python3 tools/generate_glb.py
          python3 tools/build_heritage_models_v16.py
      - run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate APK
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("app/build/outputs/apk/debug/app-debug.apk") as z:
              assert len([p for p in z.namelist() if p.startswith("assets/models/") and p.endswith(".glb")])==10
          print("Validated 10 offline concept GLBs.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Bagan-Museum-Native-V2.3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
