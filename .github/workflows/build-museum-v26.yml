name: Build Bagan Museum Native V2.6 APK
on:
  push:
    branches: [bagan-museum-native-v2-6]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Generate offline GLB models and viewer
        run: |
          python3 tools/generate_glb.py
          python3 tools/build_heritage_models_v16.py
      - name: Compile Android Debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK and V2.6 viewer instrumentation
        run: |
          python3 - <<'PY'
          import zipfile, hashlib, pathlib
          apk=pathlib.Path("app/build/outputs/apk/debug/app-debug.apk")
          assert apk.is_file()
          with zipfile.ZipFile(apk) as z:
              names=z.namelist()
              glbs=[p for p in names if p.startswith("assets/models/") and p.endswith(".glb")]
              assert len(glbs)==10,glbs
              for path in glbs:
                  assert z.read(path)[:4]==b'glTF',path
              assert "AndroidManifest.xml" in names
              assert any(x.startswith("classes") and x.endswith(".dex") for x in names)
              js=z.read("assets/heritage_viewer_v16.html")
              assert b"getBaganViewerStats" in js and b"hotspot-marker" in js
              assert b"visibilitychange" in js
          print("PASS: Android APK, 10 valid GLB headers, 3D viewer FPS hook")
          print("APK SHA256",hashlib.sha256(apk.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Bagan-Museum-Native-V2.6-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
