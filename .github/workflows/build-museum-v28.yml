name: Build Bagan Museum V2.8 Content APK
on:
  push:
    branches: [bagan-museum-native-v2-8-content30]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: |
          python3 tools/generate_glb.py
          python3 tools/build_heritage_models_v16.py
      - run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate content
        run: |
          python3 - <<'PY'
          import json,zipfile
          with zipfile.ZipFile("app/build/outputs/apk/debug/app-debug.apk") as z:
            items=json.loads(z.read("assets/bagan_content_v28_30.json"))["items"]
            assert len(items)==30
            assert sum(x["group"]=="temples" for x in items)==25
            assert sum(x["group"]=="landmarks" for x in items)==5
          print("PASS: 30 bilingual heritage records")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Bagan-Museum-Native-V2.8-Content-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
