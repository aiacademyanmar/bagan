name: Build Bagan Museum V2.9 Drive GLB AR APK
on:
  push:
    branches: [bagan-museum-native-v2-9-drive-glb-ar]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: |
          python3 tools/generate_glb.py
          python3 tools/build_heritage_models_v16.py
      - run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate imported Drive model integration
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("app/build/outputs/apk/debug/app-debug.apk") as z:
            assert "assets/drive3d_viewer_v27.html" in z.namelist()
            assert "assets/bagan_content_v28_30.json" in z.namelist()
            assert any(n.endswith(".dex") for n in z.namelist())
          print("PASS: 3D gallery and AR native APK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Bagan-Museum-Native-V2.9-Drive-3D-AR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
