name: Build Bagan Museum V3.0 Texture & AR APK
on:
  push:
    branches: [bagan-museum-native-v3-0-texture-lighting]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: |
          python3 tools/generate_glb.py
          python3 tools/build_heritage_models_v16.py
      - run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate GLB viewer and assets
        run: |
          python3 - <<'PY'
          import zipfile
          p="app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(p) as z:
            s=z.read("assets/drive3d_viewer_v27.html")
            assert b"loadTexture(" in s and b"getContext('2d')" in s
            assert b"diffuse" in s and b"180000" in s
            assert len([a for a in z.namelist() if a.startswith("assets/models/") and a.endswith(".glb")])==10
          print("PASS: textured WebGL viewer packaged, GLB assets preserved")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Bagan-Museum-Native-V3.0-Texture-AR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
