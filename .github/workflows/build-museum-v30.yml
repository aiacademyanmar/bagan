name: Build Bagan Museum V3.0 Drive GLB AR APK
on:
  push:
    branches: [bagan-museum-native-v3-0-texture]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: |
          python3 tools/generate_glb.py
          python3 tools/build_heritage_models_v16.py
      - name: Compile Native APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate APK
        run: |
          python3 - <<'PY'
          import zipfile,json
          with zipfile.ZipFile("app/build/outputs/apk/debug/app-debug.apk") as z:
            names=z.namelist()
            assert "assets/drive3d_viewer_v27.html" in names
            assert "assets/bagan_content_v28_30.json" in names
            assert len(json.loads(z.read("assets/bagan_content_v28_30.json"))["items"])==30
            assert any(x.endswith(".dex") for x in names)
          print("PASS Bagan Museum v3.0 assets and 30 records")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Bagan-Museum-Native-V3.0-Drive-GLB-AR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
