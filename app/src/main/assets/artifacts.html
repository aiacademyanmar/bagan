<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<style>*{box-sizing:border-box}body{margin:0;background:#180f0d;color:#ffe5c9;font-family:system-ui,Arial,sans-serif}header{padding:11px 12px;background:#3b241a;display:flex;gap:5px;overflow:auto}button{flex:1;min-width:69px;background:#644029;color:#fff0d4;border:1px solid #bb8d60;border-radius:9px;padding:9px 5px;font-size:12px}button.active{background:#d19758;color:#22130b;font-weight:bold}canvas{display:block;width:100%;height:300px;touch-action:none}section{padding:13px 16px;min-height:130px}h3{margin:0;color:#efc17b;font-size:19px}p{color:#ddc6ae;font-size:13px;line-height:1.6;margin:6px 0 0}small{font-size:11px;color:#baa68e}.hint{text-align:center;font-size:11px;color:#b5a38b;padding-bottom:6px}</style></head>
<body><header id="picker"></header><canvas id="stage"></canvas><section><h3 id="title"></h3><p id="description"></p><p id="burmese"></p><small>Educational 3D concept models — not actual museum-owned artifacts or archaeological scans.</small></section><div class="hint">Swipe to rotate • Pinch to zoom • Tap a category for information</div>
<script>
(function(){
"use strict";
const items=[
 {name:"Clay Pot",my:"မြေအိုး",description:"A stylized pottery vessel representing traditional ceramic techniques.",detail:"မြန်မာ့ရိုးရာ မြေအိုးလက်မှု အနုပညာကို ရည်ညွှန်းဖန်တီးထားသော နမူနာပုံစံ ဖြစ်သည်။"},
 {name:"Inscription Tablet",my:"ကျောက်စာ",description:"An illustrative stone inscription tablet; marks are decorative, not an authentic historical text.",detail:"ကျောက်စာသမိုင်းလေ့လာရန် ရေးဆွဲထားသော နမူနာဖြစ်ပြီး မူရင်းကျောက်စာ မဟုတ်ပါ။"},
 {name:"Temple Finial",my:"စေတီအထွတ်",description:"An original temple-inspired ornamental spire inspired by Bagan architectural motifs.",detail:"ပုဂံဗိသုကာအယူအဆမှ ဆင်းသက်သော အလှဆင် မော်ဒယ်ဖြစ်သည်။"},
 {name:"Heritage Column",my:"ရှေးဟောင်းတိုင်",description:"A hypothetical decorated museum column explaining historic construction motifs.",detail:"ရှေးဟောင်းအဆောက်အအုံများ၏ အလှဆင်တိုင်ပုံစံကို မိတ်ဆက်ရန် ဖန်တီးထားခြင်း ဖြစ်သည်။"}
];
let choice=0,yaw=.48,pitch=.22,dist=6.7,drag=false,px=0,py=0,pinch=0;
const c=document.getElementById("stage"),gl=c.getContext("webgl",{antialias:true});
if(!gl){document.querySelector(".hint").textContent="WebGL not supported on this device";return;}
function program(vs,fs){
 function shader(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(x));return x;}
 let p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,vs));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p;
}
const prog=program("attribute vec3 pos;attribute vec3 col;varying vec3 tint;uniform mat4 mvp;void main(){tint=col;gl_Position=mvp*vec4(pos,1.0);}",
"precision mediump float;varying vec3 tint;void main(){gl_FragColor=vec4(tint,1.0);}");
const ap=gl.getAttribLocation(prog,"pos"),ac=gl.getAttribLocation(prog,"col"),umvp=gl.getUniformLocation(prog,"mvp");
let verts=[],colors=[],gpuPos=gl.createBuffer(),gpuCol=gl.createBuffer();
function tri(a,b,d,color,shade=1){
 for(const p of [a,b,d]){verts.push(...p);colors.push(...color.map(v=>v*shade));}
}
function cube(cx,cy,cz,w,h,d,col){
 let x=cx-w/2,X=cx+w/2,y=cy-h/2,Y=cy+h/2,z=cz-d/2,Z=cz+d/2;
 let p=[[x,y,z],[X,y,z],[X,Y,z],[x,Y,z],[x,y,Z],[X,y,Z],[X,Y,Z],[x,Y,Z]];
 for(let [k,f] of [[.83,[0,1,2,3]],[.66,[5,4,7,6]],[.76,[4,0,3,7]],[.92,[1,5,6,2]],[1,[3,2,6,7]],[.55,[4,5,1,0]]]){
 tri(p[f[0]],p[f[1]],p[f[2]],col,k);tri(p[f[0]],p[f[2]],p[f[3]],col,k);
 }
}
function cylinder(x,y,z,r,h,col,upper=null,n=28){
 const top=upper===null?r:upper;
 for(let i=0;i<n;i++){
 let a=i*Math.PI*2/n,b=(i+1)*Math.PI*2/n;
 const p=[x+r*Math.cos(a),y,z+r*Math.sin(a)],q=[x+r*Math.cos(b),y,z+r*Math.sin(b)];
 const P=[x+top*Math.cos(a),y+h,z+top*Math.sin(a)],Q=[x+top*Math.cos(b),y+h,z+top*Math.sin(b)];
 tri(p,q,Q,col,.73+.22*Math.sin(a+1));tri(p,Q,P,col,.73+.22*Math.sin(a+1));
 tri([x,y+h,z],P,Q,col,1);
 }
}
function lathe(profile,color){
 for(let j=0;j<profile.length-1;j++){
 const [y,r]=profile[j],[Y,R]=profile[j+1];
 let n=32;
 for(let i=0;i<n;i++){
  let a=i*2*Math.PI/n,b=(i+1)*2*Math.PI/n;
  const p=[r*Math.cos(a),y,r*Math.sin(a)],q=[r*Math.cos(b),y,r*Math.sin(b)],P=[R*Math.cos(a),Y,R*Math.sin(a)],Q=[R*Math.cos(b),Y,R*Math.sin(b)];
  const shade=.76+.2*Math.sin(a+.6);tri(p,q,Q,color,shade);tri(p,Q,P,color,shade);
 }
 }
}
function select(i){
 choice=i;verts=[];colors=[];yaw=.48;pitch=.18;dist=5.8;
 const clay=[.71,.36,.24],gold=[.92,.69,.32],stone=[.67,.52,.36],dark=[.40,.28,.21];
 if(i===0){
   lathe([[0,.34],[.15,.45],[.32,.7],[.65,.84],[1.15,.82],[1.65,.60],[1.95,.48],[2.10,.52],[2.20,.53]],clay);
   cylinder(0,2.15,0,.53,.10,gold);
 }else if(i===1){
   cube(0,1,0,1.8,2.0,.33,stone);
   for(let j=0;j<7;j++)for(let k=0;k<4;k++)
     cube(-.58+k*.34,1.70-j*.24,.175,.18,.055,.025,dark);
   cube(0,.0,0,2.2,.17,.75,clay);
 }else if(i===2){
   cube(0,.16,0,2.1,.32,2.1,stone);
   cylinder(0,.32,0,.85,.6,clay,.64);
   cylinder(0,.91,0,.65,.50,stone,.47);
   cylinder(0,1.42,0,.49,.82,gold,.16);
   cylinder(0,2.24,0,.17,.66,gold,.018);
 }else{
   cube(0,.15,0,2.0,.3,1.7,stone);
   cylinder(0,.3,0,.47,2.02,stone,.40,16);
   cube(0,2.37,0,1.5,.32,1.4,clay);
   cube(0,2.62,0,1.85,.25,1.6,gold);
   for(let k=0;k<5;k++)cylinder(0,.5+k*.39,0,.50,.07,gold,.51,16);
 }
 gl.bindBuffer(gl.ARRAY_BUFFER,gpuPos);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW);
 gl.bindBuffer(gl.ARRAY_BUFFER,gpuCol);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(colors),gl.STATIC_DRAW);
 document.getElementById("title").textContent=items[i].name+" • "+items[i].my;
 document.getElementById("description").textContent=items[i].description;
 document.getElementById("burmese").textContent=items[i].detail;
 document.querySelectorAll("header button").forEach((b,k)=>b.className=k===i?"active":"");
}
function normalize(v){let d=Math.hypot(...v)||1;return v.map(x=>x/d);}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function dot(a,b){return a.reduce((s,x,i)=>s+x*b[i],0);}
function camera(){
 const eye=[dist*Math.sin(yaw)*Math.cos(pitch),1.35+dist*Math.sin(pitch),dist*Math.cos(yaw)*Math.cos(pitch)];
 const target=[0,1.1,0],z=normalize(eye.map((x,i)=>x-target[i])),x=normalize(cross([0,1,0],z)),y=cross(z,x);
 return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]);
}
function persp(aspect){let f=1/Math.tan(.82/2),n=.08,F=100,q=1/(n-F);return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(F+n)*q,-1,0,0,2*F*n*q,0]);}
function mul(a,b){let o=new Float32Array(16);for(let i=0;i<4;i++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)o[i*4+r]+=a[k*4+r]*b[i*4+k];return o;}
function draw(){
 let dpr=Math.min(2,devicePixelRatio||1);
 if(c.width!==Math.round(c.clientWidth*dpr)||c.height!==Math.round(c.clientHeight*dpr)){c.width=Math.round(c.clientWidth*dpr);c.height=Math.round(c.clientHeight*dpr);}
 gl.viewport(0,0,c.width,c.height);gl.clearColor(.08,.051,.038,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);
 gl.useProgram(prog);gl.uniformMatrix4fv(umvp,false,mul(persp(c.width/c.height),camera()));
 gl.enableVertexAttribArray(ap);gl.enableVertexAttribArray(ac);
 gl.bindBuffer(gl.ARRAY_BUFFER,gpuPos);gl.vertexAttribPointer(ap,3,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ARRAY_BUFFER,gpuCol);gl.vertexAttribPointer(ac,3,gl.FLOAT,false,0,0);
 gl.drawArrays(gl.TRIANGLES,0,verts.length/3);
 requestAnimationFrame(draw);
}
items.forEach((item,i)=>{let b=document.createElement("button");b.textContent=item.name;b.onclick=()=>select(i);document.getElementById("picker").appendChild(b);});
c.addEventListener("pointerdown",e=>{drag=true;px=e.clientX;py=e.clientY;c.setPointerCapture(e.pointerId);});
c.addEventListener("pointerup",()=>{drag=false;});
c.addEventListener("pointermove",e=>{if(!drag)return;yaw-=(e.clientX-px)*.009;pitch=Math.max(-1.1,Math.min(1.1,pitch+(e.clientY-py)*.006));px=e.clientX;py=e.clientY;});
c.addEventListener("wheel",e=>{e.preventDefault();dist=Math.max(3.3,Math.min(13,dist+e.deltaY*.012));},{passive:false});
c.addEventListener("touchmove",e=>{if(e.touches.length===2){e.preventDefault();let a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch)dist=Math.max(3.3,Math.min(13,dist+(pinch-d)*.02));pinch=d;}},{passive:false});
c.addEventListener("touchend",()=>pinch=0);
select(0);draw();
})();
</script></body></html>
