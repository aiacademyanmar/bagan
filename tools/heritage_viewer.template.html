<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<style>
*{box-sizing:border-box}body{background:#170f0c;color:#fbe8cd;margin:0;font:13px system-ui,Arial,sans-serif}
header{padding:9px 10px 5px;background:#302017}
h3{margin:0 0 3px;font-size:17px;color:#f0bb70}
.mini{color:#bdab96;font-size:11px}nav{display:flex;overflow-x:auto;gap:6px;padding:8px 7px;scrollbar-width:none}
nav button{flex:none;background:#473025;border:1px solid #69503e;border-radius:9px;padding:8px 10px;color:#ead4b5;font-size:11px}
nav button.sel{background:#b17a48;color:#1c130d;font-weight:bold;border-color:#f8c180}
canvas{display:block;width:100%;height:298px;touch-action:none;background:#23160f}
.viewer-wrap{position:relative;height:298px;overflow:hidden}
.hotspot-layer{position:absolute;inset:0;pointer-events:none}
.hotspot-marker{position:absolute;pointer-events:auto;min-width:34px;height:34px;border-radius:50%;
 border:2px solid #fff2bf;background:#b9812c;color:#21140a;font-size:18px;font-weight:bold;
 box-shadow:0 2px 12px #0009;transform:translate(-50%,-50%);touch-action:manipulation;z-index:2}
#hotspot-info{display:none;margin-top:7px;background:#4c3322;border:1px solid #997344;border-radius:10px;padding:10px;color:#ffe6b7;line-height:1.5}
#hotspot-info.show{display:block}
.controls{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:7px 9px;background:#291b14}
.controls button{flex:1;border:1px solid #806044;background:#463025;border-radius:8px;padding:9px 4px;color:#ffe2ba}
section{padding:10px 13px}#desc{line-height:1.6;color:#e3cbaa;margin:6px 0}
strong{color:#f3bd69}
.note{font-size:11px;color:#c5ab88;background:#2c1f17;border-radius:8px;padding:8px;margin-top:8px}
</style></head><body>
<header><h3>BAGAN HERITAGE • 10 OFFLINE 3D STUDIES</h3><div class="mini">Native Museum V2.1 • Tap numbered 3D hotspots • Illustrative geometry</div></header>
<nav id="items"></nav>
<div class="viewer-wrap"><canvas id="view"></canvas><div id="hotspot-layer" class="hotspot-layer"></div></div>
<div class="controls"><button onclick="stepModel(-1)">‹ Previous</button><button onclick="resetView()">⟳ Reset</button><button onclick="stepModel(1)">Next ›</button><button onclick="zoom(.7)">＋</button><button onclick="zoom(1.3)">－</button></div>
<section><strong id="title"></strong><div id="desc"></div><div id="hotspot-info" aria-live="polite"></div><div class="note" id="notice"></div></section>
<script>
'use strict';
const DATA=__HERITAGE_MODEL_DATA__;
const canvas=document.getElementById('view'),notice=document.getElementById('notice');
const gl=canvas.getContext('webgl',{antialias:true,alpha:false});
let fps=0,frames=0,lastSampleTime=performance.now(),triangles=0,loadMs=0;
let current=0,parts=[],bounds=null,hotspots=[],hotspotButtons=[],running=true,yaw=.44,pitch=.27,distance=20,center=[0,3,0],pointerDown=false,lastX=0,lastY=0,pinch=0;
if(!gl){notice.textContent='WebGL not supported on this Android device';}
function shader(kind,text){
 const s=gl.createShader(kind);gl.shaderSource(s,text);gl.compileShader(s);
 if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));
 return s;
}
let pr=null,attrPos,attrNorm,uMvp,uColor;
if(gl){
 pr=gl.createProgram();
 gl.attachShader(pr,shader(gl.VERTEX_SHADER,'attribute vec3 pos;attribute vec3 norm;uniform mat4 mvp;varying vec3 normal;void main(){normal=norm;gl_Position=mvp*vec4(pos,1.0);}'));
 gl.attachShader(pr,shader(gl.FRAGMENT_SHADER,'precision mediump float;uniform vec4 color;varying vec3 normal;void main(){float lum=.55+.45*abs(dot(normalize(normal),normalize(vec3(.5,.8,.3))));gl_FragColor=vec4(color.rgb*lum,1.0);}'));
 gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));
 attrPos=gl.getAttribLocation(pr,'pos');attrNorm=gl.getAttribLocation(pr,'norm');
 uMvp=gl.getUniformLocation(pr,'mvp');uColor=gl.getUniformLocation(pr,'color');
}
function buffer(target,values){
 let b=gl.createBuffer();gl.bindBuffer(target,b);gl.bufferData(target,values,gl.STATIC_DRAW);return b;
}
function arr(json,bin,i){
 let a=json.accessors[i],v=json.bufferViews[a.bufferView];
 let start=(v.byteOffset||0)+(a.byteOffset||0),count=a.count*(a.type==='VEC3'?3:1);
 if(a.componentType===5126)return new Float32Array(bin.buffer,start,count);
 if(a.componentType===5123)return new Uint16Array(bin.buffer,start,count);
 throw Error('Unknown GLB component '+a.componentType);
}
function parseGLB(b64){
 let raw=atob(b64),data=new Uint8Array(raw.length);
 for(let i=0;i<raw.length;i++)data[i]=raw.charCodeAt(i);
 let dv=new DataView(data.buffer);
 if(dv.getUint32(0,true)!==0x46546c67||dv.getUint32(4,true)!==2)throw Error('Invalid glTF v2');
 let off=12,js=null,bin=null;
 while(off<data.length){
  let length=dv.getUint32(off,true),type=dv.getUint32(off+4,true);off+=8;
  if(type===0x4e4f534a)js=JSON.parse(new TextDecoder().decode(data.slice(off,off+length)));
  if(type===0x004e4942)bin=data.slice(off,off+length);
  off+=length;
 }
 if(!js||!bin)throw Error('Incomplete GLB');
 const rendered=[];
 let xyzMin=[Infinity,Infinity,Infinity],xyzMax=[-Infinity,-Infinity,-Infinity];
 for(let item of js.meshes[0].primitives){
  let pos=arr(js,bin,item.attributes.POSITION),normal=arr(js,bin,item.attributes.NORMAL),ind=arr(js,bin,item.indices);
  for(let i=0;i<pos.length;i+=3){for(let k=0;k<3;k++){
   xyzMin[k]=Math.min(xyzMin[k],pos[i+k]);xyzMax[k]=Math.max(xyzMax[k],pos[i+k]);
  }}
  let color=js.materials[item.material].pbrMetallicRoughness.baseColorFactor;
  rendered.push({pos:buffer(gl.ARRAY_BUFFER,pos),normal:buffer(gl.ARRAY_BUFFER,normal),
    indices:buffer(gl.ELEMENT_ARRAY_BUFFER,ind),count:ind.length,color});
 }
 bounds={min:xyzMin,max:xyzMax};
 return rendered;
}
const topicByCategory={
 Temple:[
  ['Roof & Spire','The upper tier and spire are illustrative references to Bagan temple silhouettes.'],
  ['Brick Structure','Observe the massing, openings and conceptual layered brick construction.'],
  ['Heritage Base','Conservation of foundations and historical masonry is essential.']
 ],
 Pagoda:[
  ['Stupa Finial','The spire illustrates a pagoda-inspired ornamental form.'],
  ['Stupa Body','Explore the layered, rounded concept monument profile.'],
  ['Platform','Base platforms anchor the concept stupa composition.']
 ],
 Gate:[
  ['Roofline','The decorative roofline is a conceptual gateway architectural element.'],
  ['Gateway Arch','The central arched passage illustrates architectural access and enclosure.'],
  ['Foundation','The brick-base representation is not a measured archaeological site.']
 ],
 Inscription:[
  ['Upper Inscription','The upper carved surface is an educational tablet concept.'],
  ['Text Surface','Decorative strokes are not an authentic transcription or scan.'],
  ['Display Plinth','The model base represents a museum display support.']
 ]
};
function buildHotspots(){
 document.getElementById('hotspot-info').classList.remove('show');
 const layer=document.getElementById('hotspot-layer');layer.textContent='';
 hotspotButtons=[];hotspots=[];
 if(!bounds)return;
 const mn=bounds.min,mx=bounds.max;
 const x=(mn[0]+mx[0])/2, y0=mn[1],height=mx[1]-mn[1],z=mx[2];
 const w=mx[0]-mn[0];
 const positions=[[x,y0+height*.84,(mn[2]+mx[2])/2],
   [x+w*.13,y0+height*.49,z],
   [x-w*.11,y0+height*.13,z]];
 const notes=topicByCategory[DATA[current].category]||topicByCategory.Temple;
 notes.forEach((pair,i)=>{
  let b=document.createElement('button');
  b.className='hotspot-marker';b.type='button';b.textContent=(i+1).toString();
  b.setAttribute('aria-label',pair[0]);
  b.onclick=(event)=>{
   event.preventDefault();event.stopPropagation();
   const el=document.getElementById('hotspot-info');
   el.textContent=DATA[current].name+' • '+pair[0]+' — '+pair[1];
   el.classList.add('show');
  };
  layer.appendChild(b);hotspotButtons.push(b);
  hotspots.push(positions[i]);
 });
}
function updateHotspots(m){
 if(!bounds)return;
 const cw=canvas.clientWidth,ch=canvas.clientHeight;
 hotspots.forEach((p,i)=>{
  const x=p[0],y=p[1],z=p[2];
  const tx=m[0]*x+m[4]*y+m[8]*z+m[12],ty=m[1]*x+m[5]*y+m[9]*z+m[13];
  const w=m[3]*x+m[7]*y+m[11]*z+m[15];
  const button=hotspotButtons[i];
  if(w<=.01){button.style.display='none';return;}
  const nx=tx/w,ny=ty/w;
  if(Math.abs(nx)>1.05||Math.abs(ny)>1.05){button.style.display='none';return;}
  button.style.display='block';
  button.style.left=((nx+1)*cw*.5)+'px';
  button.style.top=((1-ny)*ch*.5)+'px';
 });
}
function showMonument(index){
 const modelStarted=performance.now();
 index=(index+DATA.length)%DATA.length;
 current=index;const item=DATA[current];
 document.getElementById('title').textContent=item.myanmar+' • '+item.name;
 document.getElementById('desc').textContent=item.description;
 document.getElementById('notice').textContent='Offline 3D with 3 clickable model-anchored learning points — not yet exported from the linked Drive Blender project. Use the Drive Library screen to access the original source.';
 document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('sel',i===current));
 if(!gl)return;
 parts.forEach(p=>{gl.deleteBuffer(p.pos);gl.deleteBuffer(p.normal);gl.deleteBuffer(p.indices)});
 try{parts=parseGLB(item.glb);triangles=parts.reduce((a,p)=>a+p.count/3,0);buildHotspots()}catch(e){parts=[];triangles=0;bounds=null;document.getElementById("hotspot-layer").textContent="";notice.textContent='3D loading error: '+e.message}
 loadMs=Math.max(0,performance.now()-modelStarted);
 yaw=.45;pitch=.25;center=[0,3.0,0];
 distance=item.category==='Temple'?30:(item.category==='Gate'?22:(item.category==='Inscription'?13:20));
}
function selectMonument(index){index=(index+DATA.length)%DATA.length;if(index===current&&parts.length)return;showMonument(index)}
window.getBaganViewerStats=()=>JSON.stringify({
 model:DATA[current].name,fps:Math.round(fps*10)/10,
 triangles:Math.round(triangles),loadMs:Math.round(loadMs),
 webgl:!!gl
});
function stepModel(delta){showMonument(current+delta)}
function resetView(){showMonument(current)}
function zoom(factor){distance=Math.min(80,Math.max(5,distance*factor))}
window.selectMonument=selectMonument;
function normalize(v){let n=Math.hypot(...v)||1;return v.map(x=>x/n)}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function lookAt(eye,target){
 let z=normalize(eye.map((x,i)=>x-target[i])),x=normalize(cross([0,1,0],z)),y=cross(z,x);
 return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1])
}
function perspective(aspect){let f=1/Math.tan(.8/2),n=.1,F=100,r=1/(n-F);
 return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(F+n)*r,-1,0,0,2*F*n*r,0])
}
function multiply(a,b){let o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o}
function render(){
 if(!gl||!running)return;
 frames++;
 const now=performance.now();
 if(now-lastSampleTime>=1500){
  fps=1000*frames/(now-lastSampleTime);
  frames=0;lastSampleTime=now;
 }
 const dpr=Math.min(2,window.devicePixelRatio||1),w=Math.round(canvas.clientWidth*dpr),h=Math.round(canvas.clientHeight*dpr);
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
 gl.viewport(0,0,w,h);gl.clearColor(.09,.055,.038,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);
 const eye=[center[0]+distance*Math.sin(yaw)*Math.cos(pitch),center[1]+distance*Math.sin(pitch),center[2]+distance*Math.cos(yaw)*Math.cos(pitch)];
 const matrix=multiply(perspective(w/Math.max(h,1)),lookAt(eye,center));
 gl.useProgram(pr);gl.uniformMatrix4fv(uMvp,false,matrix);
 updateHotspots(matrix);
 gl.enableVertexAttribArray(attrPos);gl.enableVertexAttribArray(attrNorm);
 for(let p of parts){
  gl.bindBuffer(gl.ARRAY_BUFFER,p.pos);gl.vertexAttribPointer(attrPos,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,p.normal);gl.vertexAttribPointer(attrNorm,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,p.indices);gl.uniform4fv(uColor,p.color);
  gl.drawElements(gl.TRIANGLES,p.count,gl.UNSIGNED_SHORT,0);
 }
 requestAnimationFrame(render);
}
for(let [i,model] of DATA.entries()){
 let b=document.createElement('button');b.textContent=(i+1)+'. '+model.name.split(' ')[0];b.onclick=()=>showMonument(i);
 document.getElementById('items').appendChild(b);
}
canvas.addEventListener('pointerdown',e=>{pointerDown=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointerup',()=>pointerDown=false);
canvas.addEventListener('pointermove',e=>{if(!pointerDown)return;yaw-=(e.clientX-lastX)*.008;
 pitch=Math.max(-1.3,Math.min(1.3,pitch+(e.clientY-lastY)*.006));lastX=e.clientX;lastY=e.clientY});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(e.deltaY*.002))},{passive:false});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();let a=e.touches[0],b=e.touches[1],n=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch)zoom(Math.exp((pinch-n)*.008));pinch=n;}},{passive:false});
canvas.addEventListener('touchend',()=>pinch=0);
document.addEventListener('visibilitychange',()=>{running=!document.hidden;if(running)requestAnimationFrame(render)});
window.addEventListener('pagehide',()=>{running=false});
showMonument(0);requestAnimationFrame(render);
</script></body></html>
