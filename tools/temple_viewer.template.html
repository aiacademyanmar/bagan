<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
*{box-sizing:border-box}body{margin:0;background:#140e0b;font-family:Arial,sans-serif;color:#ffe7c4;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap}
button{border:1px solid #bc8c58;background:#39261d;color:#ffe0a4;border-radius:9px;padding:9px 11px;font-weight:bold;font-size:12px}
button:active{background:#85543c}
#info{position:fixed;bottom:7px;left:9px;right:9px;padding:10px;border-radius:9px;background:#251813dc;color:#dfc3a0;font-size:11px;pointer-events:none}
</style></head><body>
<canvas id="scene"></canvas>
<div id="hud"><button onclick="viewExterior()">🏛 Exterior</button><button onclick="viewInterior()">🚪 Interior</button><button onclick="zoomBy(-4)">＋</button><button onclick="zoomBy(4)">－</button><button onclick="resetView()">⟳</button></div>
<div id="info">3D Model • Drag to rotate • Pinch to zoom • Offline GLB illustration</div>
<script>
'use strict';
const canvas=document.getElementById('scene'), info=document.getElementById('info');
const gl=canvas.getContext('webgl',{antialias:true,alpha:false,preserveDrawingBuffer:false});
if(!gl){info.textContent='3D WebGL is unavailable on this device.';throw Error('WebGL not supported');}
const vertexSource='attribute vec3 position;attribute vec3 normal;uniform mat4 vp;varying vec3 n;void main(){n=normal;gl_Position=vp*vec4(position,1.0);}';
const fragmentSource='precision mediump float;uniform vec4 tint;varying vec3 n;void main(){float sun=max(0.0,dot(normalize(n),normalize(vec3(0.45,0.95,0.5))));vec3 light=tint.rgb*(0.52+0.48*sun);gl_FragColor=vec4(light,1.0);}';
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertexSource));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragmentSource));gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
const aPos=gl.getAttribLocation(program,'position'),aNorm=gl.getAttribLocation(program,'normal'),uVP=gl.getUniformLocation(program,'vp'),uTint=gl.getUniformLocation(program,'tint');
const b64='__EMBEDDED_GLB__';
const raw=atob(b64),bytes=new Uint8Array(raw.length);
for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
let off=12,json=null,bin=null;
const view=new DataView(bytes.buffer);
while(off<bytes.length){const size=view.getUint32(off,true),type=view.getUint32(off+4,true);off+=8;if(type===0x4E4F534A)json=JSON.parse(new TextDecoder().decode(bytes.slice(off,off+size)));if(type===0x004E4942)bin=bytes.slice(off,off+size);off+=size;}
if(!json||!bin)throw Error('GLB data missing');
function arrayFor(i){
 const a=json.accessors[i],bv=json.bufferViews[a.bufferView],start=(bv.byteOffset||0)+(a.byteOffset||0),count=a.count*(a.type==='VEC3'?3:1);
 if(a.componentType===5126)return new Float32Array(bin.buffer,start,count);
 if(a.componentType===5123)return new Uint16Array(bin.buffer,start,count);
 throw Error('Unsupported GLB component: '+a.componentType);
}
function gpuBuf(target,arr){const b=gl.createBuffer();gl.bindBuffer(target,b);gl.bufferData(target,arr,gl.STATIC_DRAW);return b;}
const parts=[];
for(const prim of json.meshes[0].primitives){
 const points=arrayFor(prim.attributes.POSITION), normals=arrayFor(prim.attributes.NORMAL),indices=arrayFor(prim.indices);
 const material=json.materials[prim.material].pbrMetallicRoughness.baseColorFactor;
 parts.push({pb:gpuBuf(gl.ARRAY_BUFFER,points),nb:gpuBuf(gl.ARRAY_BUFFER,normals),ib:gpuBuf(gl.ELEMENT_ARRAY_BUFFER,indices),count:indices.length,tint:material,material:prim.material});
}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function norm(a){const s=Math.hypot(...a)||1;return a.map(x=>x/s);}
function minus(a,b){return a.map((x,i)=>x-b[i]);}
function lookAt(eye,center){
 const z=norm(minus(eye,center)),x=norm(cross([0,1,0],z)),y=cross(z,x);
 return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]);
}
function perspective(fov,aspect,near,far){
 const f=1/Math.tan(fov/2),r=1/(near-far);
 return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*r,-1,0,0,2*far*near*r,0]);
}
function mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o;}
let yaw=0.55,pitch=0.30,distance=35,inside=false,target=[0,5,0];
function viewExterior(){inside=false;yaw=.55;pitch=.30;distance=35;target=[0,5,0];info.textContent='Exterior • Full museum complex, spires and courtyard';}
function viewInterior(){inside=true;yaw=0;pitch=.08;distance=8;target=[0,2,0];info.textContent='Interior concept • The outer shell is hidden to explore the columns and exhibit plinth.';}
function resetView(){viewExterior();}
function zoomBy(delta){distance=Math.max(4,Math.min(70,distance+delta));}
function render(){
 const W=canvas.clientWidth,H=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);
 if(canvas.width!==Math.round(W*dpr)||canvas.height!==Math.round(H*dpr)){canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);}
 gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.065,.043,.034,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);
 const eye=[target[0]+distance*Math.sin(yaw)*Math.cos(pitch),target[1]+distance*Math.sin(pitch),target[2]+distance*Math.cos(yaw)*Math.cos(pitch)];
 const vp=mul(perspective(.95,W/Math.max(H,1),.12,120),lookAt(eye,target));
 gl.useProgram(program);gl.uniformMatrix4fv(uVP,false,vp);gl.enableVertexAttribArray(aPos);gl.enableVertexAttribArray(aNorm);
 for(const p of parts){
  if(inside && (p.material===1||p.material===3))continue;
  gl.bindBuffer(gl.ARRAY_BUFFER,p.pb);gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,p.nb);gl.vertexAttribPointer(aNorm,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,p.ib);gl.uniform4fv(uTint,p.tint);gl.drawElements(gl.TRIANGLES,p.count,gl.UNSIGNED_SHORT,0);
 }
 requestAnimationFrame(render);
}
let down=false,lastX=0,lastY=0,pinch=0;
canvas.addEventListener('pointerdown',e=>{down=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointerup',()=>{down=false});
canvas.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.008;pitch=Math.max(-1.3,Math.min(1.3,pitch+dy*.006));});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY*.025)},{passive:false});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch)zoomBy((pinch-d)*.04);pinch=d;}},{passive:false});
canvas.addEventListener('touchend',()=>pinch=0);

/* V1.3 concept walk and curated exhibit-focus hotspots: not archaeological mapping. */
const highlights=[
 {name:"Grand Museum Entrance",note:"Explore the concept red-brick gateway and its heritage-inspired facade.",pos:[0,4,7.55],yaw:.25,d:13},
 {name:"Central Pagoda Spire",note:"An original design inspired by Bagan-era temple rooflines, not a measured replica.",pos:[0,9,-1.5],yaw:.65,d:13},
 {name:"Gallery Columns",note:"Interior cutaway shows a speculative arrangement of museum display columns.",pos:[-2,2,2],yaw:.25,d:10,interior:true},
 {name:"Heritage Courtyard",note:"Courtyard and approach were created for this virtual museum concept.",pos:[0,0,11],yaw:.5,d:16},
 {name:"Decorative Brickwork",note:"Brick and sandstone color zones illustrate material themes.",pos:[6,3,1],yaw:1,d:12}
];
let focusIndex=-1,walk=false;
function focusNext(){
 walk=false;focusIndex=(focusIndex+1)%highlights.length;
 const h=highlights[focusIndex];
 inside=!!h.interior;target=h.pos.slice();yaw=h.yaw;pitch=.13;distance=h.d;
 info.textContent='HOTSPOT '+(focusIndex+1)+'/'+highlights.length+' • '+h.name+' — '+h.note;
}
function walkthrough(){
 walk=true;inside=true;target=[0,2,3.5];yaw=0;pitch=.04;distance=1.9;
 info.textContent='CONCEPT WALK • Tap Forward/Back; drag to look around. Concept cutaway, not surveyed museum.';
}
function stepWalk(dir){
 if(!walk)walkthrough();
 target[0]+=Math.sin(yaw)*dir*1.1;
 target[2]+=Math.cos(yaw)*dir*1.1;
 target[0]=Math.max(-6,Math.min(6,target[0]));
 target[2]=Math.max(-5,Math.min(6,target[2]));
 info.textContent='Walkthrough • Approx position '+target[0].toFixed(1)+', '+target[2].toFixed(1)+' • Drag to look';
}
function addAction(label,handler){
 const b=document.createElement('button');b.textContent=label;
 b.addEventListener('click',handler);document.getElementById('hud').appendChild(b);
}
addAction('🚶 Walk',walkthrough);
addAction('↑ Forward',()=>stepWalk(-1));
addAction('↓ Back',()=>stepWalk(1));
addAction('📍 Hotspot',focusNext);

requestAnimationFrame(render);
</script></body></html>
